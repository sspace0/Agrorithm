      <main class="noscript-summary">
        <p>AGRORITHM · PUNJAB PILOT</p>
        <h1>A different season starts here.</h1>
        <p>Explore crop rotations using historical NASA observations, farmer inputs and transparent water screening. Compare a demonstration maize–wheat sequence with pulse and cover-crop alternatives over the same three years.</p>
        <ul>
          <li>NASA POWER / MERRA-2: daily temperature and rainfall, 2018–2024. These observations drive crop-water estimates and historical climate exposure.</li>
          <li>NASA / USGS HLS L30 v2.0: 2023 vegetation observations; 16 of 43 scenes pass quality checks. NDVI provides cover context, not crop identity or a soil-health measurement.</li>
          <li>Cover, family diversity, stated residue and water exposure are stewardship proxies. Soil carbon, nutrient status and soil structure are not measured here.</li>
        </ul>
        <p>Regional weather grid; demonstration soil values; scenarios are not forecasts. Enable JavaScript for interactive planning, maps, local saving and exports.</p>
        <p><a href="https://github.com/sspace0/Agrorithm">Source, methods and setup</a> · <a href="/Agrorithm/data/weather.json">Cached NASA weather</a> · <a href="/Agrorithm/data/vegetation.json">Satellite record and provenance</a></p>
