name: Deploy Pages manually
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this reviewed branch as a Pages website (may be publicly accessible)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set repository deployment path
        run: echo "DEPLOY_BASE=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
